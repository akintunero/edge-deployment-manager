apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "edge-stack.fullname" . }}-control-plane
  labels:
    {{- include "edge-stack.labels" . | nindent 4 }}
data:
  control-plane.yaml: |
    server:
      host: "0.0.0.0"
      port: {{ .Values.controlPlane.service.port }}
      api_token_env: "CONTROL_PLANE_API_TOKEN"
      tls:
        enabled: false
    ha:
      enabled: {{ .Values.ha.enabled }}
      leader_lock_key: {{ .Values.ha.leaderLockKey }}
      holder_id_env: HOSTNAME
    registry:
      backend: {{ .Values.registry.backend | quote }}
      url_env: CONTROL_PLANE_DATABASE_URL
    audit:
      path: "/var/lib/edge/audit.log"
    signing:
      issuer: "control-plane"
      private_key_env: "EDGE_COMMAND_SIGNING_KEY_HEX"
    mqtt:
      {{- $mqttBroker := "mosquitto" }}
      {{- if .Values.mosquitto.enabled }}
      {{- $mqttBroker = printf "%s-mosquitto" (include "edge-stack.fullname" .) }}
      {{- end }}
      broker: {{ $mqttBroker | quote }}
      port: {{ .Values.mosquitto.service.port }}
      command_topic: "edge/commands"
      tls:
        enabled: true
        ca_cert: /etc/edge/mqtt/ca.crt
        cert_file: /etc/edge/mqtt/control-plane-mqtt.crt
        key_file: /etc/edge/mqtt/control-plane-mqtt.key
    bootstrap:
      enabled: false
