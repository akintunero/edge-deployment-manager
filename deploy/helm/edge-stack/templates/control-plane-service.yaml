apiVersion: v1
kind: Service
metadata:
  name: {{ include "edge-stack.fullname" . }}-control-plane
  labels:
    {{- include "edge-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane
spec:
  type: {{ .Values.controlPlane.service.type }}
  selector:
    app.kubernetes.io/component: control-plane
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: https
      port: {{ .Values.controlPlane.service.port }}
      targetPort: https
