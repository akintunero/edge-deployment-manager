name: Bug report
description: Report incorrect behavior or a regression
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Do not include secrets, tokens, or production credentials.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the bug and expected behavior.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: e.g. v2.0.0 or abc1234
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - edge-agent
        - control-plane
        - MQTT / TLS
        - Docker deployments
        - Kubernetes deployments
        - CI / packaging
        - other
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs (redacted)
      description: Paste sanitized logs. Remove tokens and certificate material.
