secrets:
  directory: "/run/secrets"
  require_non_empty: true

server:
  host: "127.0.0.1"
  port: 8080
  api_token_env: "CONTROL_PLANE_API_TOKEN"
  rate_limit:
    enabled: true
    max_requests: 120
    window_seconds: 60
  tls:
    enabled: false
    cert_file: "certs/control-plane.crt"
    key_file: "certs/control-plane.key"
    ca_cert: "certs/ca.crt"
    require_client_cert: false

signing:
  issuer: "control-plane"
  private_key_env: "EDGE_COMMAND_SIGNING_KEY_HEX"

mqtt:
  broker: "localhost"
  port: 1883
  keepalive: 60
  client_id: "edge-control-plane"
  command_topic: "edge/commands"
  connect_timeout: 10
  tls:
    enabled: false
    ca_cert: "certs/ca.crt"
    cert_file: "certs/control-plane-mqtt.crt"
    key_file: "certs/control-plane-mqtt.key"

registry:
  backend: json
  path: "data/devices.json"
  # For HA / multi-replica control plane, use SQLite:
  # backend: sqlite
  # path: "data/devices.db"

audit:
  path: "data/audit.log"

bootstrap:
  enabled: true
  token_env: "EDGE_BOOTSTRAP_TOKEN"
  # Optional: set token_hash_env and EDGE_BOOTSTRAP_TOKEN_HASH (sha256 hex) instead of plain token.
  rate_limit:
    enabled: true
    max_requests: 10
    window_seconds: 60
  cert_validity_days: 365
  pki:
    ca_cert: "certs/ca.crt"
    ca_key: "certs/ca.key"
  credential_paths:
    ca_cert: "/etc/edge/ca.crt"
    cert_file: "/etc/edge/agent.crt"
    key_file: "/etc/edge/agent.key"
  default_policy:
    allowed_actions:
      - deploy
    allowed_deployment_types:
      - docker
      - kubernetes
    allowed_images:
      - "nginx:*"
    allowed_yaml_roots:
      - "/opt/edge/manifests"
  agent_config_template:
    mqtt:
      broker: "localhost"
      port: 8883
      keepalive: 60
      client_id: "edge-deployment-manager"
      topics:
        commands: "edge/commands"
        deployments: "edge/deployments"
        status: "edge/status"
        logs: "edge/logs"
      tls:
        enabled: true
    security:
      require_signed_commands: true
      max_clock_skew_seconds: 300
      nonce_ttl_seconds: 900
      trusted_signers:
        - issuer: "control-plane"
          public_key_hex: "REPLACE_WITH_ED25519_PUBLIC_KEY_HEX"
